<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FS App Premium - Master Edition V56</title>

	<!-- iOS için Tam Ekran ve İkon -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="ikon.png">

    <!-- Android için "Gömülü" Manifest (Tek Dosya Çözümü) -->
    <link rel="manifest" href='data:application/manifest+json,{"display":"standalone","start_url":"index.html","short_name":"Uygulama","name":"Benim App","theme_color":"#d4af37","background_color":"#000000"}'>
    
    <!-- Android Bildirim Çubuğu Rengi -->
    <meta name="theme-color" content="#d4af37">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.js"></script>

    <style>
        /* --- TEMEL AYARLAR --- */
        :root {
            --bg-color: #121212;
            --logo-color: #D4AF37;
            --event-color: #ffffff; 
            --text-color: #eee;
            --card-bg: #1e1e1e;
            --ease-custom: cubic-bezier(0.25, 1, 0.5, 1);
            --anim-duration: 0.6s;
            --danger: #cc0000;
            --success: #007E33;
            --global-color: #40E0D0;
        }

        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; overflow: hidden; height: 100vh; width: 100vw; user-select: none; touch-action: manipulation; }

        /* --- LOGO VE GİRİŞ --- */
        #logo { 
            position: absolute; display: flex; justify-content: center; align-items: center; border-radius: 50%; 
            cursor: pointer; overflow: hidden; z-index: 1001;
            transform: translate(-50%, -50%);
            transition: top var(--anim-duration) var(--ease-custom), left var(--anim-duration) var(--ease-custom), 
                        width var(--anim-duration) var(--ease-custom), height var(--anim-duration) var(--ease-custom), 
                        border-color 0.3s, box-shadow 0.3s, background-color 0.3s;
        }
        #logo-img { position: absolute; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; pointer-events: none; opacity: 1; border-radius: 50%;}
        
        #login-ui { position: absolute; opacity: 0; display: none; flex-direction: column; align-items: center; transition: opacity 0.3s; z-index: 10;}
        .login-inp { background: #111; border: 1px solid var(--logo-color); color: #fff; padding: 15px; border-radius: 8px; width: 220px; margin-bottom: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .login-btn { background: var(--logo-color); color: #000; border: none; padding: 15px 40px; font-weight: 900; border-radius: 8px; cursor: pointer; font-size: 1.1rem; width: 220px;}

        body.state-intro #logo { top: 35%; left: 50%; width: 220px; height: 220px; background: #1a1a1a; border: 2px solid var(--logo-color); box-shadow: 0 0 50px rgba(212, 175, 55, 0.4); }
        body.state-login #logo, body.state-loading #logo, body.state-error #logo, body.state-success #logo { top: 50%; left: 50%; width: 120vw; height: 120vw; background: var(--bg-color); border: 4px solid var(--logo-color); box-shadow: none; cursor:default; }
        body.state-login #logo-img, body.state-loading #logo-img, body.state-error #logo-img, body.state-success #logo-img { opacity: 0; }
        body.state-login #login-ui { display: flex; opacity: 1; transition-delay: 0.3s; pointer-events: auto; }
        body.state-error #logo { border-color: var(--danger); box-shadow: inset 0 0 50px rgba(204, 0, 0, 0.2); }
        body.state-success #logo { border-color: var(--success); box-shadow: inset 0 0 50px rgba(0, 126, 51, 0.2); }
        
        #status-icon { position: absolute; display: none; align-items: center; justify-content: center; width: 80px; height: 80px; z-index: 5; }
        body.state-loading #status-icon, body.state-error #status-icon, body.state-success #status-icon { display: flex; opacity: 1; }
        .loader-ring { position: absolute; width: 100%; height: 100%; border: 5px solid transparent; border-top-color: var(--logo-color); border-right-color: var(--logo-color); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        body.state-menu #logo { top: 15%; left: 50%; width: 100px; height: 100px; background: #1a1a1a; border: 2px solid var(--logo-color); box-shadow: 0 5px 20px rgba(212, 175, 55, 0.2); pointer-events:auto;}
        body.state-content #logo { top: 40px; left: 40px; width: 45px; height: 45px; background: #1a1a1a; border: 1px solid var(--logo-color); box-shadow: none; pointer-events:auto;}

        /* --- YENİ NESİL ROLLER & KUSURSUZ ÇERÇEVELER --- */
        .b-fresh { border: 1px solid #777; }
        .badge-fresh { background: #1a1a1a; color: #777; border: 1px solid #777; }
        
        .b-junior { border: 2px solid transparent; border-bottom: 2px solid #fff; border-left: 2px solid rgba(255,255,255,0.4); border-right: 2px solid rgba(255,255,255,0.4); border-radius: 50%; } 
        .badge-junior { background: #1a1a1a; color: #fff; border: 2px solid #fff; }
        
        .b-senior { border: 2px solid #fff; border-radius: 50%; }
        .badge-senior { background: #1a1a1a; color: #fff; border: 2px solid #fff; }
        
        .b-global { border: 2px solid var(--global-color); border-radius: 50%; box-shadow: 0 0 10px rgba(64,224,208,0.4); }
        .badge-global { background: #1a1a1a; color: var(--global-color); border: 2px solid var(--global-color); }
        
        .b-chief { border: 2px solid var(--logo-color); border-radius: 50%; }
        .badge-chief { background: #1a1a1a; color: var(--logo-color); border: 2px solid var(--logo-color); }
        
        .b-admin { border: 4px double var(--logo-color); border-radius: 50%; }
        .badge-admin { background: #1a1a1a; color: var(--logo-color); border: 2px solid var(--logo-color); }

        /* --- ÜST MENÜ & İKONLAR --- */
        .top-icon { position: absolute; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; background: #1a1a1a; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-sizing:border-box;}
        
        #profile-icon-wrapper { top: 20px; right: 20px; width: 45px; height: 45px; }
        #profile-icon-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; padding:2px; box-sizing:border-box; }
        
        /* FIX: position relative kaldırıldı, .top-icon class'ı zaten absolute. Bu sayede ikon yerinde kalır! */
        #notes-icon-wrapper { top: 25px; right: 80px; width: 35px; height: 35px; border: 1px solid #555; }
        
        body.state-menu .top-icon, body.state-content .top-icon { opacity: 1; pointer-events: auto !important; }

        /* YENİ BAŞLIK VE ADMIN DROPDOWN YAPISI */
        #title-wrapper { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        body.state-content #title-wrapper { opacity: 1; pointer-events: auto; }
        #page-title { margin: 0; font-size: 1.2rem; font-weight: 600; text-transform: uppercase; color: var(--logo-color); cursor: pointer; padding: 5px 15px; border-radius: 8px; transition: background 0.2s;}
        #page-title:active { background: rgba(212,175,55,0.1); }
        #admin-crew-trigger { display: none; color: var(--logo-color); cursor: pointer; font-size: 0.8rem; padding: 10px; margin-left: -10px; user-select: none;}
        #admin-crew-dropdown { display: none; position: absolute; top: 40px; left: 50%; transform: translateX(-50%); background: #1a1a1a; border: 1px solid var(--logo-color); border-radius: 8px; z-index: 10000; padding: 10px; width: 160px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }

        #main-menu { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 80%; display: flex; flex-direction: column; gap: 15px; opacity: 0; pointer-events: none; transition: all 0.5s ease; z-index: 50;}
        body.state-menu #main-menu { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) translateY(30px); }
        .menu-btn { background: var(--card-bg); color: white; border: none; padding: 20px; font-size: 1.2rem; border-radius: 12px; border-left: 5px solid var(--logo-color); text-align: left; padding-left: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; width: 100%; }
        
        #content-wrapper { position: absolute; top: 90px; left: 0; width: 100%; height: calc(100% - 90px); padding: 20px; padding-bottom: 50px; overflow-y: auto; opacity: 0; pointer-events: none; transition: all 0.5s ease; z-index: 50; transform: translateY(30px);}
        body.state-content #content-wrapper { opacity: 1; pointer-events: auto; transform: translateY(0);}
        .tab-content { display: none; width: 100%; height: auto; }
        .tab-content.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

        /* --- TAKVİM --- */
        .view-selectors { display: flex; gap: 10px; margin-bottom: 20px; }
        .v-btn { flex: 1; background: #222; border: 1px solid #444; color: #888; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .v-btn.active { border-color: var(--logo-color); color: var(--logo-color); background: #2a2a2a; }
        .schedule-row { background: var(--card-bg); margin-bottom: 10px; border-radius: 8px; position: relative; border: 2px solid transparent; cursor: pointer; overflow: hidden; transition: all 0.3s; }
        .schedule-row.today { border: 2px solid var(--logo-color) !important; background: #222; }
        .schedule-row.conflict { border: 2px solid var(--danger) !important; box-shadow: inset 0 0 15px rgba(204,0,0,0.3); } 
        .border-empty { border-color: #333; opacity: 0.8;}
        .row-main { display: flex; padding: 15px; align-items: center; }
        .schedule-date-box { width: 55px; text-align: center; display: flex; flex-direction: column; color: var(--logo-color); flex-shrink: 0;}
        .schedule-row.border-empty .schedule-date-box { color: #666; }
        .s-day-num { font-size: 1.3rem; font-weight: bold; }
        .s-day-name { font-size: 0.7rem; color: #888; text-transform: uppercase;}
        .day-divider-box { display:flex; gap:2px; margin: 0 15px; align-self:stretch; justify-content:center;}
        .day-divider { width: 4px; border-radius: 2px; }
        .day-divider.otel { background: var(--logo-color); }
        .day-divider.etk { background: var(--event-color); }
        .day-divider.empty { background: #444; width: 1px;}
        .s-info { flex: 1; display: flex; flex-direction: column; gap: 5px; justify-content: center; }
        .gate-badge { align-self: flex-start; background: transparent; color: var(--logo-color); font-weight: bold; font-size: 0.9rem; }
        .row-detail { display: none; padding: 0 15px 15px 15px; border-top: 1px dashed #333; margin-top: -5px; position: relative; }
        .schedule-row.expanded .row-detail { display: block; animation: slideDown 0.3s ease; }
        .cal-edit-btn { position: absolute; top: 10px; left: 10px; z-index: 10; background: var(--logo-color); color: #000; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: bold; font-size: 0.85rem; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .module-card { background: #222; border-left: 3px solid transparent; padding: 10px; margin-top: 10px; border-radius: 6px; position: relative;}
        .module-otel { border-left-color: var(--logo-color); }
        .module-event { border-left-color: var(--event-color); }
        .m-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 4px;}
        .m-time { font-size: 0.85rem; color: #aaa; }
        .m-desc { font-size: 0.8rem; color: #888; margin-top: 5px; line-height: 1.3;}
        .month-header { margin-top: 25px; margin-bottom: 10px; color: var(--logo-color); font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .grid-container { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .grid-h { text-align: center; font-size: 0.7rem; color: #666; font-weight: bold; padding-bottom: 5px; }
        .grid-cell { background: var(--card-bg); height: 85px; max-height: 85px; overflow: hidden; border-radius: 4px; padding: 4px; border: 1px solid #333; position: relative; cursor: pointer; display: flex; flex-direction: column;}
        .grid-cell.today { border: 2px solid var(--logo-color) !important; background: #222; }
        .grid-cell.conflict { border: 2px solid var(--danger) !important; box-shadow: inset 0 0 10px rgba(204,0,0,0.5); }
        .grid-num { font-size: 0.9rem; font-weight: bold; margin-bottom: 2px;}
        .grid-cell.g-empty .grid-num { color: #666; }
        .grid-line { height: 3px; border-radius: 2px; margin-bottom: 4px; width: 100%; flex-shrink: 0; }
        .grid-line.otel { background: var(--logo-color); }
        .grid-line.etk { background: var(--event-color); }
        .grid-line.mix { background: linear-gradient(to right, var(--logo-color) 50%, var(--event-color) 50%); }
        .grid-txt { font-size: 0.65rem; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px;}
        .grid-txt.otel { color: var(--logo-color);} 
        .grid-txt.etk { color: #eee;}
        .grid-detail-row { grid-column: 1 / -1; background: #222; border: 2px solid #555; border-radius: 8px; padding: 15px; margin: 5px 0; display: none; position: relative; animation: slideDown 0.3s ease; cursor: default; }
        .grid-detail-row::before { content: ''; position: absolute; top: -12px; left: calc((100% / 7) * (var(--col) - 0.5) - 10px); border-width: 0 10px 12px 10px; border-style: solid; border-color: transparent transparent #555 transparent; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- REJİ KARTLARI --- */
        .reji-row { display: flex; flex-direction: column; background: #222; margin-bottom: 12px; border-radius: 8px; border-left: 3px solid var(--logo-color); cursor:pointer; overflow:hidden; box-shadow:0 4px 6px rgba(0,0,0,0.2);}
        .reji-edit-row-raw { display: flex; flex-direction: column; background: #222; margin-bottom: 15px; padding: 12px 10px 10px 10px; border-radius: 8px; position: relative; box-shadow:0 4px 6px rgba(0,0,0,0.2);}
        .reji-inp { flex: 1; min-width: 0; background: #111; border: 1px solid #444; color: white; padding: 8px 10px; border-radius: 6px; font-size: 0.9rem; font-family:inherit;}
        .reji-ctrl-btn { padding: 6px; background: transparent; color: var(--danger); border: none; border-radius: 4px; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; cursor: pointer;}
        
        /* --- MÜHENDİSLİK HARİTASI --- */
        .blueprint-container {
            background-color: #0b0b0b;
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px; border: 2px solid var(--logo-color); border-radius: 8px;
            padding: 20px 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 5px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8); animation: slideDown 0.3s ease; box-sizing: border-box;
        }
        .bp-slot { min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border-radius:8px; transition:all 0.2s;}
        .bp-slot.drag-over { background: rgba(212,175,55,0.1); border: 1px dashed var(--logo-color); }
        .bp-slot.drag-over .bp-circle { transform: scale(1.15); border-color:var(--logo-color); }

        .bp-circle {
            width: 50px; height: 50px; border-radius: 50%; border: 1px dashed #666; background: rgba(255,255,255,0.03);
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #555;
            cursor: pointer; transition: all 0.2s; position: relative; z-index:2; box-sizing:border-box;
        }
        .bp-circle:hover { border-color: var(--logo-color); color: var(--logo-color); background: rgba(212,175,55,0.1); }
        .bp-circle.filled { border: 2px solid var(--logo-color); border-style: solid; background: #111; overflow: hidden; color: transparent; touch-action: none;}
        .bp-circle.filled img { width: 100%; height: 100%; object-fit: cover; pointer-events:none; border-radius:50%;}
        .bp-circle.dragging { opacity: 0.4; transform: scale(0.9); }
        .bp-name { font-size: 0.75rem; color: #aaa; margin-top: 5px; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight:bold; letter-spacing:0.5px;}
        
        .bp-actions {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 20;
            background: rgba(0,0,0,0.85); padding: 5px; border-radius: 6px; border: 1px solid var(--logo-color); box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: max-content;
        }
        .bp-actions.active { opacity: 1; pointer-events: auto; }
        .bp-act-btn { background: transparent; border: none; color: #fff; padding: 5px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight:bold;}

        /* --- PROFİL SEKMESİ --- */
        .prof-header { text-align:center; padding-top:10px; padding-bottom: 20px; border-bottom: 1px solid #333; margin-bottom: 20px; position:relative;}
        .prof-avatar { width:140px; height:140px; border-radius:50%; display:flex; justify-content:center; align-items:center; background:var(--card-bg); overflow: hidden; font-size: 60px; position: relative; box-sizing:border-box; margin:0 auto;}
        .prof-name { margin: 0; font-size: 1.8rem; color: #fff; margin-top:25px;}
        .prof-section { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .prof-sec-title { color: var(--logo-color); font-size: 1.1rem; margin: 0 0 15px 0; font-weight: bold; border-bottom: 1px dashed #444; padding-bottom: 5px; display:flex; justify-content:space-between; align-items:center;}
        .skill-tag { display: inline-block; padding: 6px 12px; border-radius: 4px; margin: 0 8px 8px 0; font-size: 0.85rem;}
        .bio-text { color: #bbb; font-size: 0.95rem; line-height: 1.5; margin: 0;}
        .note-area { width: 100%; background: #111; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-family: inherit; resize: vertical; min-height: 100px; margin-bottom: 10px;}

        /* EKİP LİSTESİ */
        .team-member-card { background: #222; padding: 15px; border-radius: 10px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; cursor: pointer; border-left: 3px solid transparent;}
        .tm-avatar { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: #111; display:flex; justify-content:center; align-items:center; font-size:25px; position:relative; box-sizing:border-box;}

        .back-ui-btn { display:flex; align-items:center; gap:10px; margin-bottom:20px; cursor:pointer; width:fit-content;}
        .back-ui-icon { width:30px; height:30px; border-radius:50%; background:#222; border:1px solid #444; display:flex; justify-content:center; align-items:center; color:var(--logo-color); font-size:1.1rem; font-weight:bold;}
        .back-ui-text { color:#aaa; font-weight:bold; font-size:0.85rem; letter-spacing:0.5px;}

        /* --- EĞİTİM SEKMESİ --- */
        .edu-tool-card { background: #1e1e1e; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid var(--logo-color); transition: background 0.3s; overflow:hidden;}
        .edu-tool-header { padding: 15px 15px; font-size: 1.2rem; font-weight: 900; display: flex; justify-content: space-between; align-items:center; cursor: pointer; text-transform: uppercase; color: #fff;}
        .edu-choreo-list { display: none; background:#151515; animation: slideDown 0.3s ease; }
        .edu-choreo-list.active { display: block; }
        .edu-choreo-row { padding: 12px 15px; border-bottom: 1px solid #2a2a2a; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;}
        .edu-choreo-row:hover { background: #222; }
        .edu-choreo-row:last-child { border-bottom: none; }
        .edu-c-title { font-size: 0.9rem; font-weight: bold; color: #ccc;}
        .edu-progress-bg { background: #333; height: 6px; border-radius: 4px; overflow: hidden; width:70px; margin-top:5px;}
        .edu-progress-bar { background: var(--logo-color); height: 100%; transition: width 0.5s ease;}
        
        .move-card { background: #222; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid transparent; overflow: hidden;}
        .move-c-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #222;}
        .move-title { font-weight: bold; font-size: 0.95rem; color: #fff;}
        .move-c-body { display: none; padding: 0 15px 15px 15px; border-top: 1px dashed #333; background: #1e1e1e; animation: slideDown 0.3s ease;}
        .move-c-body.active { display: block; }
        .move-desc { font-size: 0.85rem; color: #aaa; margin-top: 10px; margin-bottom: 10px; line-height: 1.4;}
        
        .fs-checkbox { width: 24px; height: 24px; border: 2px solid #555; border-radius: 5px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; background: #111; flex-shrink: 0; position: relative;}
        .fs-checkbox.state-0 { background: #555; border-color: #555; color: #fff; }
        .fs-checkbox.state-0::after { content: "✓"; font-weight: 900; font-size: 16px; }
        .fs-checkbox.state-1 { background: var(--logo-color); border-color: var(--logo-color); color: #000; }
        .fs-checkbox.state-1::after { content: "✓"; font-weight: 900; font-size: 16px; }

        /* GELİŞTİR (DEVELOP) UI */
        .dev-tab-btns { display:flex; border:1px solid var(--logo-color); border-radius:8px; overflow:hidden; margin-bottom:20px; }
        .dev-tab-btn { flex:1; text-align:center; padding:12px; background:#111; color:var(--logo-color); font-weight:bold; cursor:pointer; transition:all 0.3s;}
        .dev-tab-btn.active { background:var(--logo-color); color:#000; }
        .dev-tool-chip { display:inline-block; padding:8px 12px; border-radius:20px; background:#111; border:1px solid #555; color:#aaa; margin:0 5px 5px 0; cursor:pointer; font-size:0.85rem;}
        .dev-tool-chip.active { border-color:var(--logo-color); color:var(--logo-color); font-weight:bold; }

        function getRoleClass(role) {
            let r = (role || "").toLowerCase();
            if(r==='admin') return 'admin'; if(r==='chief' || r==='sef') return 'chief';
            if(r==='global') return 'global'; if(r==='senior') return 'senior';
            if(r==='junior') return 'junior'; return 'fresh';
        }

        function getRoleLevel(role) {
            let r = (role || "").toLowerCase();
            if(r === 'admin' || r === 'chief' || r === 'sef') return 5;
            if(r === 'global') return 4;
            if(r === 'senior') return 3;
            if(r === 'junior') return 2;
            return 1;

        function escapeHTML(str) {
            if(str === null || str === undefined) return "";
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function showToast(msg, isSuccess = false) {
            let t = document.createElement('div'); t.innerText = msg;
            let bg = isSuccess ? "var(--success)" : "var(--danger)";
            t.style.cssText = `position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:${bg}; color:white; padding:10px 20px; border-radius:20px; z-index:9999; font-weight:bold; font-size:0.9rem; animation: fadeInOut 2s ease forwards; box-shadow:0 4px 10px rgba(0,0,0,0.5);`;

        function cleanTime(val) {
            if (!val || val === "null" || val === "") return "null";
            let str = String(val).replace(/^'/, ''); 
            if (str.includes("GMT") || str.includes("1899") || str.includes("T")) {
                let d = new Date(str);
                if (!isNaN(d)) return String(d.getHours()).padStart(2, '0') + ":" + String(d.getMinutes()).padStart(2, '0');
            }
            if (str.length >= 5 && str.includes(":")) return str.split(":")[0].padStart(2, '0') + ":" + str.split(":")[1].padStart(2, '0');
            return str;
        }

        function formatDateTR(dStr) {
            if(!dStr) return ""; let p = String(dStr).split('-'); if(p.length !== 3) return dStr;
            return `${parseInt(p[2])}.${parseInt(p[1])}.${p[0]}`; 
        }

        function parseModule(m) {
            let n = m.name || ""; let isOtel = String(n).startsWith('$'); let cleanName = isOtel ? String(n).substring(1).trim() : n;
            let hasTime = (m.showtime && m.showtime !== "null" && m.showtime !== "" && cleanTime(m.showtime) !== "null");
            return { isOtel, cleanName, hasTime, showtime: m.showtime, desc: m.desc };
        }

        function sortModules(modules) {
            modules.sort((a,b) => {
                let cA = cleanTime(a.showtime); let cB = cleanTime(b.showtime);
                let tA = (cA && cA !== "null" && cA !== "") ? cA : "00:00"; let tB = (cB && cB !== "null" && cB !== "") ? cB : "00:00";
                return tA.localeCompare(tB);
            });
        }

        }

        function getUserTasks(targetKey) {
            if(!targetKey) targetKey = user.key;
            let u = (targetKey === user.key) ? user : teamData.find(x => x.key == targetKey);
            if(!u) return {};
            try { return JSON.parse(u.tasks || "{}"); } catch(e) { return {}; }
        }

        function getProgressPercent(moveListStr, targetKey) {
            if (!moveListStr || moveListStr.trim() === "") return 0;
            let tasks = getUserTasks(targetKey);
            let moves = moveListStr.split(',').map(s => s.trim()).filter(s => s);
            if (moves.length === 0) return 100;
            let completed = 0;
            moves.forEach(mId => { if (tasks[mId] === 1) completed++; });
            return Math.round((completed / moves.length) * 100);
        }

        function resolveTransfer(requesterKey, memberKey, isAccepted) {
            let reqChief = teamData.find(u => u.key === requesterKey);
            if(!reqChief) return;
            
            let reqList = [];
            try { reqList = JSON.parse(reqChief.notes); } catch(e) {}
            if(!Array.isArray(reqList)) reqList = [];
            reqList = reqList.filter(k => k !== memberKey);
            reqChief.notes = JSON.stringify(reqList);
            
            if (isAccepted) {
                let member = teamData.find(u => u.key === memberKey);
                if (member) member.crew = reqChief.crew;
            }

            let actionText = isAccepted ? 'Kabul Edildi' : 'Reddedildi';
            showToast("Transfer " + actionText, true);
            
            openNotesModal(); 
            checkNotifications(); 
            if(document.getElementById('Team').classList.contains('active')) renderTeamList();

            let payload = { action: 'resolveTransfer', requesterKey: requesterKey, memberKey: memberKey, isAccepted: isAccepted };
            fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }).catch(e=>console.log(e));
        }

        function requestTransfer(memberKey, e) {
            if(e) e.stopPropagation();
            let reqList = [];
            try { reqList = user.notes ? JSON.parse(user.notes) : []; } catch(err) { reqList = []; }
            if(!Array.isArray(reqList)) reqList = [];
            
            if(!reqList.includes(memberKey)) {
                reqList.push(memberKey);
                user.notes = JSON.stringify(reqList);
                localStorage.setItem('fs_v56', JSON.stringify(user));
                showToast("Transfer isteği gönderildi!", true);
                renderTeamMemberProfile(memberKey); 
                
                fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({action: 'updateNotes', key: user.key, notes: user.notes}) }).catch(err => console.log(err));
            }
        }
        
        function directTransfer(memberKey, e) {
            if(e) e.stopPropagation();
            let member = teamData.find(u => u.key === memberKey);
            if(member) {
                member.crew = user.crew;
                showToast("Ekibe Alındı!", true);

            checkNotifications();
            
            fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({action: 'updateNotes', key: memberKey, notes: ""}) }).catch(e=>console.log(e));

        function handlePhotoSelect(event) {
            const file = event.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('crop-modal').style.display = 'flex'; const el = document.getElementById('croppie-container');
                if(croppieInstance) { croppieInstance.destroy(); }
                croppieInstance = new Croppie(el, { viewport: { width: 220, height: 220, type: 'circle' }, boundary: { width: '100%', height: 300 }, showZoomer: true, enableOrientation: true });
                croppieInstance.bind({ url: e.target.result });
            }
            reader.readAsDataURL(file); event.target.value = ""; 
        }
        function closeCropModal() { document.getElementById('crop-modal').style.display = 'none'; if(croppieInstance) { croppieInstance.destroy(); croppieInstance = null; } }
        function saveCroppedImage() {

                closeCropModal(); showSync(); document.getElementById('sync-text').innerText = 'Fotoğraf Yükleniyor...';
                const payload = { action: 'uploadProfilePhoto', key: user.key, base64: base64 };
                fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
                .then(r=>r.json()).then(res => {
                    if(res.success) { user.photo = res.fileId; localStorage.setItem('fs_v56', JSON.stringify(user)); updateProfileUI(); hideSync(); } else { alert("Hata"); hideSync(); }

        // ADMIN EKİPLERİ MENÜYE YÜKLE

            if(getRoleClass(user.role) !== 'admin') return;
            let crews = [...new Set(teamData.map(m => m.crew).filter(c => c && c !== "Bağımsız"))].sort();
            
            if(!adminSelectedCrew && crews.length > 0) {
                adminSelectedCrew = crews[0];
                changeAdminCrew(adminSelectedCrew); 
                return;
            }

            let dd = document.getElementById('admin-crew-dropdown');
            let html = "";
            crews.forEach(c => {
                let isSel = (c === adminSelectedCrew);
                html += `<div style="padding:10px; color:${isSel ? '#000' : '#fff'}; background:${isSel ? 'var(--logo-color)' : 'transparent'}; font-weight:bold; border-radius:6px; cursor:pointer; margin-bottom:5px; text-align:center;" onclick="changeAdminCrew('${escapeJS(c)}')">${escapeHTML(c)}</div>`;

        async function loadData() {
            showSync(); document.getElementById('sync-text').innerText = 'Veriler Yükleniyor...';
            try {
                const roleP = encodeURIComponent(user.role || ""); 
                const crewP = encodeURIComponent(adminSelectedCrew || user.crew || "");
                const res = await fetch(`${API}?action=getAllData&role=${roleP}&crew=${crewP}`).then(r=>r.json());
                if(res.success === false || !res.allUsers) throw new Error("Fallback needed");
                
                allUsersData = res.allUsers || [];
                teamData = res.team || []; teamDataLoaded = true;
                agendaData = res.agenda || []; agendaData.forEach(row => { if(row.modules) sortModules(row.modules); }); setCalendarView('week'); 
                rejiData = res.reji || []; renderReji(); 
                libraryData = res.library || []; toolData = res.tool || []; educationData = res.education || []; 
                
                updateAdminCrewSelector();
                updateProfileUI();
                if(document.getElementById('Egitim').classList.contains('active')) renderEgitimMain();
                if(document.getElementById('Team').classList.contains('active')) renderTeamList();
                hideSync();
            } catch (e) {
                console.log("Tekil Paket Başarısız, Yedek Motor Devrede:", e);
                const roleP = encodeURIComponent(user.role || ""); 
                const crewP = encodeURIComponent(adminSelectedCrew || user.crew || "");
                Promise.all([
                    fetch(`${API}?action=getAllUsersBasic`).then(r=>r.json()),
                    fetch(`${API}?action=getTeamData&role=${roleP}&crew=${crewP}`).then(r=>r.json()),
                    fetch(`${API}?action=getAgenda&crew=${crewP}`).then(r=>r.json()),
                    fetch(`${API}?action=getReji&crew=${crewP}`).then(r=>r.json()),
                    fetch(`${API}?action=getLibrary`).then(r=>r.json()),
                    fetch(`${API}?action=getTool`).then(r=>r.json()),
                    fetch(`${API}?action=getEducation`).then(r=>r.json())
                ]).then(results => {
                    allUsersData = results[0] || [];
                    teamData = results[1] || []; teamDataLoaded = true;
                    agendaData = results[2] || []; agendaData.forEach(row => { if(row.modules) sortModules(row.modules); }); setCalendarView('week');
                    rejiData = results[3] || []; renderReji();
                    libraryData = results[4] || []; toolData = results[5] || []; educationData = results[6] || [];
                    updateAdminCrewSelector();
                    updateProfileUI();
                    if(document.getElementById('Egitim').classList.contains('active')) renderEgitimMain();
                    if(document.getElementById('Team').classList.contains('active')) renderTeamList();
                    hideSync();
                }).catch(err => { hideSync(); showToast("Veri bağlantısı kurulamadı!"); });
            }
        }

        //         EKİP (CREW) YÖNETİMİ

        function openTeamView() {

        function renderTeamList() {

            let filteredTeam = teamData.filter(m => {
                let rc = getRoleClass(m.role);

                groups[c].push(m);

            let sortedCrews = Object.keys(groups).sort((a, b) => {
                if (a === user.crew) return -1;

                } else {

                    } else {
                        transferBtnHtml = `<button type="button" style="position:absolute; top:0; right:0; background:var(--logo-color); color:#000; border:none; padding:5px 10px; border-radius:6px; font-weight:bold; font-size:0.75rem; cursor:pointer;" onclick="requestTransfer('${memberKey}', event)">Transfer İste</button>`;

        // ==========================================
        //         EĞİTİM YÖNETİMİ & VİDEO OYNATMA
        // ==========================================
        function toggleChoreoTick(cIdx, e) {
            if(e) e.stopPropagation(); 
            let targetKey = adminViewingUserKey || user.key;
            let skills = getUserSkills(targetKey); let tasks = getUserTasks(targetKey); 
            
            let cObj = educationData[cIdx]; if(!cObj) return;
            let choreoId = `${cObj.tool}_${cObj.song}`; let state = skills[choreoId]; 
            
            let uRole = (user.role || "").toLowerCase();
            let isAuthority = ['admin', 'sef', 'chief'].includes(uRole) && targetKey !== user.key;

            if (isAuthority) {
                if(state === 0 || state === undefined) {
                    skills[choreoId] = 1; 
                    if(cObj.list) String(cObj.list).split(',').map(s=>s.trim()).filter(s=>s).forEach(m => tasks[m] = 1);
                } else if(state === 1) delete skills[choreoId]; 
            } else {
                if(state === 1) return;
                if(state === 0) delete skills[choreoId]; else skills[choreoId] = 0;
            }
            saveTrainingData(targetKey, skills, tasks);
            
            if (document.getElementById('edu-detail-view').style.display === 'block') renderSongDetail(); else renderEgitimMain();
            if(adminViewingUserKey && document.getElementById('team-member-profile').style.display === 'block') renderTeamMemberProfile(adminViewingUserKey);
        }

        function toggleMoveTick(mId, e) {
            if(e) e.stopPropagation(); 
            let targetKey = adminViewingUserKey || user.key;
            let tasks = getUserTasks(targetKey); let state = tasks[mId];
            let uRole = (user.role || "").toLowerCase();
            let isAuthority = ['admin', 'sef', 'chief'].includes(uRole) && targetKey !== user.key;

            if (isAuthority) {
                if(state === 0 || state === undefined) tasks[mId] = 1;
                else if(state === 1) delete tasks[mId];
            } else {
                if(state === 1) return;
                if(state === 0) delete tasks[mId]; else tasks[mId] = 0;
            }
            saveTrainingData(targetKey, null, tasks); renderSongDetail();
        }

        function toggleTool(tIdx) { 
            let tool = toolData[tIdx].tool;
            openTool = (openTool === tool) ? null : tool; 
            renderEgitimMain(); 
        }

        function renderEgitimMain() {
            try {
                let uRole = (user.role || "").toLowerCase();
                let isSuper = ['admin', 'sef', 'chief'].includes(uRole);
                if (isSuper) {
                    document.getElementById('dev-button-container').style.display = adminViewingUserKey ? 'none' : 'block';
                }

                const area = document.getElementById('edu-main-list');
                if (!toolData || toolData.length === 0) { 
                    area.innerHTML = `<div style='text-align:center; color:#888; padding:20px;'>Eğitim verisi bulunamadı.</div>`; 
                    return; 
                }
                
                let targetKey = adminViewingUserKey || user.key; 
                let html = ""; 
                let skills = getUserSkills(targetKey); 
                let userLvl = getRoleLevel(user.role);

                toolData.forEach((tData, tIdx) => {
                    let tool = String(tData.tool); 
                    let tRate = parseInt(tData.rate) || 1;
                    
                    if(targetKey === user.key && userLvl < tRate) return;

                    if (isOpen) {
                        html += `<div class="edu-choreo-list active" style="margin-bottom:15px; border-bottom-left-radius:8px; border-bottom-right-radius:8px; border-left: 4px solid var(--logo-color);">`;
                        html += `<div class="edu-choreo-row" style="cursor:pointer;" onclick="openSongDetail(${tIdx}, -1)"><div class="edu-c-title" style="color:var(--logo-color);">Tüm Hareketler</div><div><span style="color:var(--logo-color); font-size:0.9rem;">İncele ➝</span></div></div>`;

                        let choreos = educationData.filter(e => e.tool === tool);
                        if (choreos.length === 0) { html += `<div class="edu-choreo-row"><div class="edu-c-title" style="color:#666; font-style:italic;">Koreografi Eklenmemiş</div></div>`; }

                        choreos.forEach((c) => {
                            let cIdx = educationData.indexOf(c);

                            let percent = getProgressPercent(moveListStr, targetKey);
                            let choreoId = `${tool}_${c.song}`;
                            let state = skills[choreoId]; 
                            
                            let rightSideHtml = "";
                            if (percent === 100 || !moveListStr.trim()) {
                                let tickClass = ""; 
                                if(state === 0) tickClass = "state-0"; 
                                else if(state === 1) tickClass = "state-1"; 
                                rightSideHtml = `<div class="fs-checkbox ${tickClass}" onclick="toggleChoreoTick(${cIdx}, event)"></div>`;
                            } else { 
                                rightSideHtml = `<div style="width:70px; text-align:right;"><div class="edu-progress-bg"><div class="edu-progress-bar" style="width:${percent}%"></div></div></div>`; 
                            }
                            
                            html += `<div class="edu-choreo-row" style="cursor:pointer;" onclick="openSongDetail(${tIdx}, ${cIdx})"><div class="edu-c-title">${escapeHTML(c.song)}</div><div>${rightSideHtml}</div></div>`;
                        });
                        html += `</div>`;
                    }
                });
                area.innerHTML = html;
            } catch(e) { console.error("Egitim Render Hata: ", e); document.getElementById('edu-main-list').innerHTML = `<div style="color:red; padding:20px;">Hata: ${e.message}</div>`; }
        }

        let currentOpenSong = null; let currentOpenTool = null;
        function openSongDetail(tIdx, cIdx) {
            currentOpenTool = toolData[tIdx].tool; 
            if(cIdx === -1) { currentOpenSong = 'Tüm Hareketler'; } else { currentOpenSong = educationData[cIdx].song; }
            openMove = null; document.getElementById('edu-main-list').style.display = 'none'; document.getElementById('edu-detail-view').style.display = 'block'; renderSongDetail();
        }
        function toggleMoveAccordion(indexId) { openMove = (openMove === indexId) ? null : indexId; renderSongDetail(); }

        function renderSongDetail() {
            try {
                const area = document.getElementById('edu-detail-view');
                let targetKey = adminViewingUserKey || user.key;
                let isAllMoves = (currentOpenSong === 'Tüm Hareketler');
                let movesStr = ""; let choreoUrl = "";
                
                if(isAllMoves) { 
                    let t = toolData.find(x => x.tool === currentOpenTool); 
                    if(t) movesStr = t.moves.join(','); 
                } 
                else { 
                    let choreo = educationData.find(e => e.tool === currentOpenTool && e.song === currentOpenSong); 
                    if(choreo) { movesStr = choreo.list || ""; choreoUrl = choreo.url || ""; } 
                }

                let playBtnHtml = "";
                if (!isAllMoves && choreoUrl && choreoUrl.trim() !== "") {
                    let isChoreoYoutube = choreoUrl.includes("youtu");
                    let cBtnAction = isChoreoYoutube
                        ? `window.open('${choreoUrl}', '_blank')`
                        : `document.getElementById('vid-frame').src='${getEmbedUrl(choreoUrl)}'; document.getElementById('media-overlay').style.display='block';`;

                    playBtnHtml = `<div onclick="${cBtnAction}" style="color:var(--logo-color); font-size:1.8rem; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0 15px; transform:scale(1.2);">▶</div>`;
                }

                let html = `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:15px; border-bottom:1px dashed #333; margin-bottom:15px;">
                        <div onclick="document.getElementById('edu-detail-view').style.display='none'; document.getElementById('edu-main-list').style.display='block'; currentOpenSong=null; currentOpenTool=null;" style="cursor:pointer; font-size:1.2rem; font-weight:900; color:var(--logo-color); text-transform:uppercase; flex:1; text-align:left;">${escapeHTML(currentOpenTool)}</div>
                        ${playBtnHtml}
                        <div style="font-size:1.1rem; font-weight:bold; color:#fff; flex:1; text-align:right;">${escapeHTML(currentOpenSong)}</div>
                    </div>
                `;

                let moves = []; if(movesStr) moves = String(movesStr).split(',').map(s=>s.trim()).filter(s=>s);
                let tasks = getUserTasks(targetKey);

                if (moves.length === 0) { html += `<div style="color:#666; font-style:italic; text-align:center; margin-top:20px;">Hareket listesi boş.</div>`; } 
                else {
                    moves.forEach((mId, index) => {
                        let lib = libraryData.find(l => l.id && l.id.toString().toLowerCase() === mId.toLowerCase());
                        let mName = lib ? lib.name : mId; let mDesc = lib ? lib.desc : ""; let mUrlOriginal = lib ? lib.url : "";
                        
                        let isLibYoutube = mUrlOriginal.includes("youtu");
                        let libBtnAction = isLibYoutube
                            ? `window.open('${mUrlOriginal}', '_blank')`
                            : `document.getElementById('vid-frame').src='${getEmbedUrl(mUrlOriginal)}'; document.getElementById('media-overlay').style.display='block';`;

tton type="button" onclick="saveReji()" style="flex:1; background:var(--logo-color); color:#000; border:none; padding:15px; border-radius:8px; font-weight:bold; cursor:pointer;">Kaydet</button></div></div>`; } else { if(rejiData.length === 0) container.innerHTML = `<div style="text-align:center; color:#888; font-style:italic;">Gösterilecek reji notu yok.</div>`; rejiData.forEach((r, idx) => { let isReadBlueprintOpen = (openBlueprintIdx === idx); let dancersList = []; for(let j=3; j<12; j++) { if(r[j]) { let member = allUsersData.find(t => t.key === r[j]); if(member) { let nameColor = (user && r[j] === user.key) ? 'color:var(--logo-color);' : 'color:#ccc;'; let safeName = (member.name && String(member.name).trim()!=="") ? escapeHTML(member.name.split(' ')[0]) : "İsimsiz"; dancersList.push(`<span style="${nameColor}">${safeName}</span>`); } } } let dancersHtml = dancersList.length > 0 ? dancersList.join(', ') : '-'; container.innerHTML += `<div class="reji-row" onclick="toggleReadBlueprint(${idx})"><div style="display:flex; width:100%; align-items:center; padding:15px;"><div style="font-weight:900; color:var(--logo-color); width:25px; font-size:1.1rem; text-align:left; flex-shrink:0;">${r[0] || ""}</div><div style="font-weight:bold; font-size:1rem; flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis;">${escapeHTML(r[1] || "")}</div><div style="flex:1.5; text-align:center; font-size:0.8rem; font-weight:bold; color:var(--logo-color); line-height:1.3; display:flex; justify-content:center; flex-wrap:wrap; gap:5px;">${dancersHtml}</div><div style="font-size:0.85rem; color:#888; flex:1; text-align:right; overflow:hidden; text-overflow:ellipsis;">${escapeHTML(r[2] || "")}</div></div>${isReadBlueprintOpen ? `<div class="blueprint-container" style="margin:0 10px 15px 10px; width:calc(100% - 20px);" onclick="event.stopPropagation()">${generateReadSlotsHtml(idx)}</div>` : ''}</div>`; }); } } catch(e) { console.error("Reji Render Error: ", e); } }
        let isRejiEditing = false; function toggleRejiEdit() { isRejiEditing = !isRejiEditing; document.getElementById('reji-edit-btn').style.display = isRejiEditing ? 'none' : 'block'; openBlueprintIdx = -1; if (isRejiEditing) renderReji(); else loadData(); } function cancelRejiEdit() { isRejiEditing = false; document.getElementById('reji-edit-btn').style.display = 'block'; renderReji(); } function updateRejiInputs() { document.querySelectorAll('.reji-edit-row-raw').forEach((rowEl) => { let idx = parseInt(rowEl.dataset.idx); let cEl = document.getElementById(`r-c-${idx}`); let mEl = document.getElementById(`r-m-${idx}`); if(cEl && mEl && rejiData[idx]) { rejiData[idx][1] = cEl.value; rejiData[idx][2] = mEl.value; } }); } function toggleBlueprint(idx) { updateRejiInputs(); openBlueprintIdx = (openBlueprintIdx === idx) ? -1 : idx; renderReji(); }
        let bpDragData = null; function bpHandleDragStart(e, rIdx, sIdx) { bpDragData = {r: rIdx, s: sIdx}; e.dataTransfer.setData("text/plain", sIdx); e.target.classList.add('dragging'); } function bpHandleDragEnter(e, rIdx, sIdx) { e.preventDefault(); let slot = e.target.closest('.bp-slot'); if(slot) slot.classList.add('drag-over'); } function bpHandleDragLeave(e, rIdx, sIdx) { let slot = e.target.closest('.bp-slot'); if(slot) slot.classList.remove('drag-over'); } function bpHandleDrop(e, targetRowIdx, targetSlotIdx) { e.preventDefault(); document.querySelectorAll('.bp-slot').forEach(el => el.classList.remove('drag-over')); document.querySelectorAll('.bp-circle').forEach(el => el.classList.remove('dragging')); if(bpDragData && bpDragData.r === targetRowIdx && bpDragData.s !== targetSlotIdx) { let temp = rejiData[targetRowIdx][3 + bpDragData.s]; rejiData[targetRowIdx][3 + bpDragData.s] = rejiData[targetRowIdx][3 + targetSlotIdx]; rejiData[targetRowIdx][3 + targetSlotIdx] = temp; renderReji(); } bpDragData = null; } function bpTouchStart(e, rIdx, sIdx) { bpDragData = {r: rIdx, s: sIdx}; e.target.closest('.bp-circle').classList.add('dragging'); } function bpTouchMove(e) { if(bpDragData) e.preventDefault(); } function bpTouchEnd(e) { if(!bpDragData) return; document.querySelectorAll('.bp-circle').forEach(el => el.classList.remove('dragging')); let touch = e.changedTouches[0]; let elem = document.elementFromPoint(touch.clientX, touch.clientY); let slot = elem ? elem.closest('.bp-slot') : null; if(slot && slot.dataset.slotidx) { let tRow = parseInt(slot.dataset.rowidx); let tSlot = parseInt(slot.dataset.slotidx); if(tRow === bpDragData.r && tSlot !== bpDragData.s) { let temp = rejiData[tRow][3 + bpDragData.s]; rejiData[tRow][3 + bpDragData.s] = rejiData[tRow][3 + tSlot]; rejiData[tRow][3 + tSlot] = temp; } } bpDragData = null; renderReji(); }
        function generateSlotsHtml(rowIdx) { let html = ""; let r = rejiData[rowIdx]; for(let i=0; i<9; i++) { let cellData = r[3 + i]; if(!cellData) { html += `<div class="bp-slot" data-rowidx="${rowIdx}" data-slotidx="${i}" ondragenter="bpHandleDragEnter(event, ${rowIdx}, ${i})" ondragleave="bpHandleDragLeave(event, ${rowIdx}, ${i})" ondragover="event.preventDefault()" ondrop="bpHandleDrop(event, ${rowIdx}, ${i})"><div class="bp-circle" onclick="openDancerSelect(${rowIdx}, ${i}, event)">+</div></div>`; } else { let member = allUsersData.find(t => t.key === cellData); let name = (member && member.name && String(member.name).trim() !== "") ? member.name.split(' ')[0] : "İsimsiz"; let photoHtml = member && member.photo ? `<img src="${getSafePhotoUrl(member.photo)}">` : ``; html += `<div class="bp-slot" data-rowidx="${rowIdx}" data-slotidx="${i}" ondragenter="bpHandleDragEnter(event, ${rowIdx}, ${i})" ondragleave="bpHandleDragLeave(event, ${rowIdx}, ${i})" ondragover="event.preventDefault()" ondrop="bpHandleDrop(event, ${rowIdx}, ${i})"><div class="bp-circle filled" draggable="true" ondragstart="bpHandleDragStart(event, ${rowIdx}, ${i})" ontouchstart="bpTouchStart(event, ${rowIdx}, ${i})" ontouchmove="bpTouchMove(event)" ontouchend="bpTouchEnd(event)" onclick="toggleSlotActions(${rowIdx}, ${i}, event)">${photoHtml}</div><div class="bp-actions" id="bp-act-${rowIdx}-${i}"><button type="button" class="bp-act-btn" onclick="openDancerSelect(${rowIdx}, ${i}, event)">Değiştir</button><button type="button" class="bp-act-btn" style="color:var(--danger);" onclick="removeDancer(${rowIdx}, ${i}, event)">Sil</button></div><div class="bp-name">${escapeHTML(name)}</div></div>`; } } return html; }
        
        let dsTargetRow = -1; let dsTargetSlot = -1; 
        function openDancerSelect(rowIdx, slotIdx, e) { 
            if(e) e.stopPropagation(); 
            updateRejiInputs(); dsTargetRow = rowIdx; dsTargetSlot = slotIdx; let html = ""; 
            
            let uRole = (user.role || "").toLowerCase();
            let isAdmin = ['admin'].includes(uRole);
            let activeCrew = isAdmin ? adminSelectedCrew : user.crew;
            
            let availableDancers = teamData.filter(m => m.crew === activeCrew);

            availableDancers.forEach(member => { 
                let safeUrl = getSafePhotoUrl(member.photo); let photoHtml = safeUrl ? `<img src="${safeUrl}" style="width:30px;height:30px; border-radius:50%; object-fit:cover;">` : `👤`; 
                html += `<div style="background:#222; padding:10px; border-radius:6px; display:flex; align-items:center; gap:10px; cursor:pointer;" onclick="selectDancer('${escapeJS(member.key)}')"><div style="width:30px; height:30px; display:flex; justify-content:center; align-items:center;">${photoHtml}</div><span style="color:#fff; font-weight:bold;">${escapeHTML(member.name)}</span></div>`; 
            }); 
            
            if(availableDancers.length === 0) html = `<div style="color:#888; text-align:center; padding:10px;">Ekibinizde dansçı bulunmuyor.</div>`;
            
            document.getElementById('ds-list').innerHTML = html; document.getElementById('dancer-select-modal').style.display = 'flex'; 
        }

        function selectDancer(userKey) { let r = rejiData[dsTargetRow]; for(let i=3; i<12; i++) { if(r[i] === userKey && i !== (3+dsTargetSlot)) { showToast("Bu dansçı zaten sahnede!"); return; } } rejiData[dsTargetRow][3 + dsTargetSlot] = userKey; closeDancerSelect(); renderReji(); } function closeDancerSelect() { document.getElementById('dancer-select-modal').style.display = 'none'; } function removeDancer(rowIdx, slotIdx, e) { if(e) e.stopPropagation(); rejiData[rowIdx][3 + slotIdx] = ""; renderReji(); } function toggleSlotActions(rowIdx, slotIdx, e) { if(e) e.stopPropagation(); document.querySelectorAll('.bp-actions').forEach(el => el.classList.remove('active')); document.getElementById(`bp-act-${rowIdx}-${slotIdx}`).classList.toggle('active'); }
        function addRejiRow() { updateRejiInputs(); rejiData.push([rejiData.length+1, "", "", "", "", "", "", "", "", "", "", ""]); renderReji(); } function delReji(idx) { updateRejiInputs(); rejiData.splice(idx, 1); rejiData.forEach((r,i)=>r[0]=i+1); renderReji(); }
        async function saveReji() { updateRejiInputs(); isRejiEditing = false; document.getElementById('reji-edit-btn').style.display = 'block'; renderReji(); showSync(); const payload = { action: 'saveReji', data: rejiData, crew: adminSelectedCrew || user.crew }; fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }).then(hideSync).catch(e=>console.log(e)); }
        let rDraggedIdx = null; function handleRejiTouchStart(e, idx) { rDraggedIdx = idx; const target = e.target.closest('.reji-edit-row-raw'); target.style.opacity = '0.5'; document.addEventListener('touchmove', handleRejiTouchMove, {passive: false}); document.addEventListener('touchend', handleRejiTouchEnd); document.addEventListener('mousemove', handleRejiTouchMove); document.addEventListener('mouseup', handleRejiTouchEnd); } function handleRejiTouchMove(e) { if(rDraggedIdx === null) return; e.preventDefault(); const clientY = e.touches ? e.touches[0].clientY : e.clientY; const clientX = e.touches ? e.touches[0].clientX : e.clientX; const elem = document.elementFromPoint(clientX, clientY); const row = elem ? elem.closest('.reji-edit-row-raw') : null; document.querySelectorAll('.reji-edit-row-raw').forEach(r => r.style.borderTop = 'none'); if(row && row.dataset.idx !== rDraggedIdx.toString()) row.style.borderTop = '3px solid var(--logo-color)'; } function handleRejiTouchEnd(e) { if(rDraggedIdx === null) return; const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY; const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX; const elem = document.elementFromPoint(clientX, clientY); const row = elem ? elem.closest('.reji-edit-row-raw') : null; if(row) { const dropIdx = parseInt(row.dataset.idx); if(rDraggedIdx !== dropIdx) { const temp = rejiData[rDraggedIdx]; rejiData.splice(rDraggedIdx, 1); rejiData.splice(dropIdx, 0, temp); rejiData.forEach((r, i) => r[0] = i + 1); } } rDraggedIdx = null; document.removeEventListener('touchmove', handleRejiTouchMove); document.removeEventListener('touchend', handleRejiTouchEnd); document.removeEventListener('mousemove', handleRejiTouchMove); document.removeEventListener('mouseup', handleRejiTouchEnd); renderReji(); }

        // GÜNÜ DÜZENLE VE MODALLAR 
        let dayReorderData = [];
        function resetDeleteMode() { document.querySelectorAll('.reji-edit-row').forEach(el => { const normal = el.querySelector('.normal-view'); const opts = el.querySelector('.delete-opts-view'); if(normal) normal.style.display = 'flex'; if(opts) opts.style.display = 'none'; }); }
        function showDeleteOpts(idx, e) { e.stopPropagation(); resetDeleteMode(); const row = document.querySelector(`.reji-edit-row[data-idx='${idx}']`); if(row) { row.querySelector('.normal-view').style.display = 'none'; row.querySelector('.delete-opts-view').style.display = 'flex'; } }
        function openDayEdit(dateStr, dayStr, e) { e.stopPropagation(); resetDeleteMode(); let row = agendaData.find(r => r.date === dateStr); if (row) row.conflict = false; let rIdx = row ? row.rowIndex : ""; let gateStr = (row && row.gate) ? cleanTime(row.gate) : ""; if (gateStr === "null") gateStr = ""; document.getElementById('de-row-index').value = rIdx; document.getElementById('de-date-str').value = dateStr; document.getElementById('de-day-str').value = dayStr; document.getElementById('de-date-title').innerText = `${dayStr}, ${formatDateTR(dateStr)}`; document.getElementById('de-gate-time').value = gateStr; dayReorderData = (row && row.modules) ? JSON.parse(JSON.stringify(row.modules)) : []; renderDayEditList(); document.getElementById('day-edit-modal').style.display = 'flex'; }
        function renderDayEditList() { let container = document.getElementById('de-module-list'); container.innerHTML = ""; const btnAdd = document.getElementById('btn-add-new-module'); if(dayReorderData.length >= 6) btnAdd.style.display = 'none'; else btnAdd.style.display = 'block'; if(dayReorderData.length === 0) { container.innerHTML = `<div style="color:#888; font-style:italic; text-align:center; padding:15px; border: 1px dashed #444; border-radius: 8px;">Bu gün için planlanmış bir iş yok.</div>`; return; } dayReorderData.forEach((m, idx) => { let parsed = parseModule(m); let borderColor = parsed.isOtel ? 'var(--logo-color)' : 'var(--event-color)'; container.innerHTML += `<div class="reji-edit-row" data-idx="${idx}" style="background:#222; border-radius:6px; margin-bottom:8px; display:flex; flex-direction:column; overflow:hidden; border-left: 3px solid ${borderColor};"><div class="normal-view" style="display:flex; align-items:center; padding:10px; width:100%;"><div class="card-center-click" onclick="openModuleEditInsideDay(${idx}, event)" style="flex:1; cursor:pointer;"><div style="color:#fff; font-weight:bold;">${escapeHTML(parsed.cleanName)}</div><div style="color:#aaa; font-size:0.8rem;">Saat: ${parsed.hasTime ? cleanTime(parsed.showtime) : 'Belirtilmedi'}</div></div><button type="button" class="reji-ctrl-btn" onclick="showDeleteOpts(${idx}, event)" style="margin-left:auto; color:var(--danger); background:transparent; border:none; font-size:1.3rem; cursor:pointer;">🗑</button></div><div class="delete-opts-view" style="display:none; width:100%; height:50px;"><button type="button" class="del-opt-btn single" style="flex:1; border:none; background:#ff4d4d; color:#fff; font-weight:bold; cursor:pointer;" onclick="massDeleteModule(${idx}, 'single', event)">Tek Seferlik</button><button type="button" class="del-opt-btn future" style="flex:1; border:none; background:#cc0000; color:#fff; font-weight:bold; cursor:pointer;" onclick="massDeleteModule(${idx}, 'future', event)">Bundan Sonra</button><button type="button" class="del-opt-btn all" style="flex:1; border:none; background:#990000; color:#fff; font-weight:bold; cursor:pointer;" onclick="massDeleteModule(${idx}, 'all', event)">Tamamen</button></div></div>`; }); }
        function openModuleEditInsideDay(modIdx, e) { e.stopPropagation(); resetDeleteMode(); const mData = dayReorderData[modIdx]; let parsed = parseModule(mData); document.getElementById('modal-title').innerText = "İşi Düzenle"; document.getElementById('wrap-freq').style.display = 'none'; document.getElementById('f-row-index').value = document.getElementById('de-row-index').value; document.getElementById('f-module-index').value = modIdx; document.getElementById('f-type').value = parsed.isOtel ? 'sahne' : 'etkinlik'; document.getElementById('f-name').value = parsed.cleanName; document.getElementById('f-show-time').value = parsed.hasTime ? cleanTime(parsed.showtime) : ""; document.getElementById('f-desc').value = parsed.desc || ""; document.getElementById('f-date').value = document.getElementById('de-date-str').value; document.getElementById('f-day').value = document.getElementById('de-day-str').value; toggleFormFields(); document.getElementById('day-edit-modal').style.display = 'none'; document.getElementById('event-modal').style.display = 'flex'; }
        async function saveDayGate(event) { const rIdx = document.getElementById('de-row-index').value; const dStr = document.getElementById('de-date-str').value; if(!rIdx) { alert("Lütfen önce etkinlik ekleyin."); return; } const nGate = document.getElementById('de-gate-time').value; let targetRow = agendaData.find(r => r.date === dStr); if(targetRow) targetRow.gate = nGate; renderTakvim(); showSync(); triggerSync([targetRow]); const btn = event.target; btn.innerText = "Kaydedildi"; setTimeout(() => { btn.innerText = "Kaydet"; }, 1000); }
        async function massDeleteModule(modIdx, scope, event) { event.stopPropagation(); resetDeleteMode(); const dStr = document.getElementById('de-date-str').value; const dayStr = document.getElementById('de-day-str').value; const targetRawName = dayReorderData[modIdx].name; document.getElementById('day-edit-modal').style.display = 'none'; let modifiedDays = []; agendaData.forEach(row => { let match = false; if (scope === 'single' && row.date === dStr) match = true; else if (scope === 'future' && row.date >= dStr && row.day.toLowerCase() === dayStr.toLowerCase()) match = true; else if (scope === 'all' && row.day.toLowerCase() === dayStr.toLowerCase()) match = true; if (match && row.modules) { let idx = row.modules.findIndex(m => m.name === targetRawName); if (idx > -1) { row.modules.splice(idx, 1); if (row.modules.length === 0) row.gate = ""; modifiedDays.push(row); } } }); renderTakvim(); showSync(); triggerSync(modifiedDays); }
        function openAddFromDayEdit() { if(dayReorderData.length >= 6) return; document.getElementById('day-edit-modal').style.display = 'none'; document.getElementById('modal-title').innerText = "Yeni İş Ekle"; document.getElementById('wrap-freq').style.display = 'block'; document.getElementById('f-row-index').value = ""; document.getElementById('f-module-index').value = ""; document.getElementById('f-name').value = ""; document.getElementById('f-desc').value = ""; document.getElementById('f-show-time').value = ""; document.getElementById('f-gate').value = ""; document.getElementById('f-start-date').value = ""; document.getElementById('f-end-date').value = ""; document.getElementById('f-type').value = "sahne"; document.getElementById('f-freq').value = "single"; document.getElementById('f-date').value = document.getElementById('de-date-str').value; document.getElementById('f-day').value = document.getElementById('de-day-str').value; toggleFormFields(); document.getElementById('event-modal').style.display = 'flex'; }
        function toggleFormFields() { const type = document.getElementById('f-type').value; const freq = document.getElementById('f-freq').value; document.getElementById('lbl-name').innerText = type === 'sahne' ? 'Sahne İsmi' : 'Etkinlik İsmi'; document.getElementById('lbl-show-time').innerText = type === 'sahne' ? 'Showtime' : 'Aksiyon'; document.getElementById('field-date-single').style.display = freq === 'single' ? 'block' : 'none'; document.getElementById('field-date-weekly').style.display = (freq === 'weekly' || freq === 'biweekly') ? 'block' : 'none'; document.getElementById('fields-weekly-range').style.display = (freq === 'weekly' || freq === 'biweekly') ? 'block' : 'none'; document.getElementById('field-otel-gate').style.display = type === 'sahne' ? 'block' : 'none'; }
        function closeModal() { document.getElementById('event-modal').style.display = 'none'; }
        
        async function saveEvent() { const isEdit = document.getElementById('f-row-index').value !== ""; const modIdx = document.getElementById('f-module-index').value; const type = document.getElementById('f-type').value; const freq = document.getElementById('f-freq').value; let name = document.getElementById('f-name').value.trim(); if(!name) { alert("Lütfen bir isim girin!"); return; } if (type === 'sahne') { if (!String(name).startsWith('$')) name = '$' + name; } else { if (String(name).startsWith('$')) name = String(name).substring(1).trim(); } const desc = document.getElementById('f-desc').value; const show = document.getElementById('f-show-time').value || ""; const newGate = type === 'sahne' ? document.getElementById('f-gate').value : ""; const targetDate = document.getElementById('f-date').value; const targetDayName = document.getElementById('f-day').value; const startDate = document.getElementById('f-start-date').value; const endDate = document.getElementById('f-end-date').value; if(!isEdit && (freq === 'weekly' || freq === 'biweekly') && (!startDate || !endDate)) { alert("Lütfen Başlangıç ve Bitiş tarihlerini seçin!"); return; } document.getElementById('event-modal').style.display = 'none'; let modifiedDays = []; if (isEdit) { let row = agendaData.find(r => r.date === targetDate); if(row && row.modules[modIdx]) { if (newGate) row.gate = newGate; row.modules[modIdx] = {name: name, showtime: show, desc: desc}; sortModules(row.modules); modifiedDays.push(row); } } else if (freq === 'weekly' || freq === 'biweekly') { let start = new Date(startDate); let end = new Date(endDate); let dayStep = freq === 'biweekly' ? 14 : 7; let current = new Date(start); while(current <= end && trDaysFull[current.getDay()] !== targetDayName) { current.setDate(current.getDate() + 1); } while(current <= end) { let dStr = `${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,'0')}-${String(current.getDate()).padStart(2,'0')}`; let row = agendaData.find(r => r.date === dStr); if (row) { if (row.modules && row.modules.length > 0) row.conflict = true; else if (newGate) row.gate = newGate; if (row.modules.length < 6) { row.modules.push({name: name, showtime: show, desc: desc}); sortModules(row.modules); modifiedDays.push(row); } } else { let newRow = {rowIndex:"", date: dStr, day: targetDayName, gate: newGate, conflict: false, modules: [{name: name, showtime: show, desc: desc}]}; agendaData.push(newRow); modifiedDays.push(newRow); } current.setDate(current.getDate() + dayStep); } } else { let row = agendaData.find(r => r.date === targetDate); if(row) { if (newGate) row.gate = newGate; if (row.modules.length < 6) { row.modules.push({name: name, showtime: show, desc: desc}); sortModules(row.modules); modifiedDays.push(row); } } else { let newRow = {rowIndex:"", date: targetDate, day: targetDayName, gate: newGate, conflict: false, modules: [{name: name, showtime: show, desc: desc}]}; agendaData.push(newRow); modifiedDays.push(newRow); } } renderTakvim(); showSync(); triggerSync(modifiedDays); }
    </script>
